name: build

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: xamx-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Prepare Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: cp target/release/xamx-rs target/release/xamx-rs-linux-x86_64

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item target/release/xamx-rs.exe target/release/xamx-rs-windows-x86_64.exe

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xamx-rs-linux-x86_64
          path: xamx-rs/target/release/xamx-rs-linux-x86_64

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xamx-rs-windows-x86_64
          path: xamx-rs/target/release/xamx-rs-windows-x86_64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/xamx-rs-linux-x86_64/xamx-rs-linux-x86_64
            release-assets/xamx-rs-windows-x86_64/xamx-rs-windows-x86_64.exe
